<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MOLMS</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf8f4}#molmsApp{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="molmsApp" title="MOLMS"></iframe>
<script>
(function(){
  const frame=document.getElementById('molmsApp');
  function ensureRuntime(d,id,src){
    if(d.getElementById(id))return true;
    const s=d.createElement('script');
    s.id=id;
    s.src=src;
    s.async=false;
    d.body.appendChild(s);
    return true;
  }
  function injectModules(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)return false;
      ensureRuntime(d,'molmsDocumentModuleV3','/js/document-module-v3.js?v=20260908b');
      ensureRuntime(d,'molmsIntercomModuleV3','/js/intercom-module-v3.js?v=20260908c');
      return true;
    }catch(e){
      console.error('MOLMS module runtime load failed',e);
      return false;
    }
  }
  frame.addEventListener('load',injectModules);
  frame.src='/app-core.html?v=20260908c';
  let attempts=0;
  const fallback=setInterval(function(){
    if(injectModules()||++attempts>=20)clearInterval(fallback);
  },250);
})();
</script>
</body>
</html>
