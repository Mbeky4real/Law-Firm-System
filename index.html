<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MOLMS</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf8f4}#molmsApp{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="molmsApp" src="/app-core.html" title="MOLMS"></iframe>
<script>
(function(){
  const frame=document.getElementById('molmsApp');
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d||d.getElementById('molmsDocumentUploadRuntime'))return;
      const s=d.createElement('script');
      s.id='molmsDocumentUploadRuntime';
      s.src='/js/document-upload-v1.js?v=20260907c';
      s.defer=true;
      d.body.appendChild(s);
    }catch(e){console.error('MOLMS document runtime load failed',e)}
  });
})();
</script>
</body>
</html>
