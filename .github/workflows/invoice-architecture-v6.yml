name: Invoice architecture v6
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-invoice-architecture-v6.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical invoice architecture
        run: python .github/patch-invoice-architecture-v6.py
      - name: Verify architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('MOLMS-INVOICE-PAYMENT-V2')==1, s.count('MOLMS-INVOICE-PAYMENT-V2')
          assert 'MOLMS-INVOICE-PAYMENT-CONTEXT-V3' not in s
          assert 'MOLMS-INVOICE-PAYMENT-ROUTER-V4' not in s
          assert 'MOLMS-DASHBOARD-PAYMENT-DIRECT-V5' not in s
          assert s.count('MOLMS-INVOICE-CANONICAL-V6')==1
          assert s.count('id="invEmailModal"')==1
          assert s.count('send-invoice-email')>=1
          print('invoice architecture v6 verified')
          PY
      - name: Commit production source
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(invoice): canonicalize payment flow and activate email delivery'
          git push origin HEAD:main
