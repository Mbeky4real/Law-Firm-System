name: Documents Real Upload v1
'on':
  push:
    paths:
      - '.github/triggers/document-upload-v1.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Documents module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); marker='MOLMS-DOCUMENT-UPLOAD-V1'
          if marker in s: raise SystemExit
          block='''
<!-- MOLMS-DOCUMENT-UPLOAD-V1 -->
<style>#docUploadV1Box{margin:10px 0;padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}#docUploadV1Box .du-note{font-size:12px;color:#667085;margin-top:6px}#docUploadV1Box .du-ok{color:#087443;font-weight:600}#docUploadV1Box .du-bad{color:#b42318;font-weight:600}</style>
<script>
(function(){const MAX=2097152,BUCKET='molms-documents';function c(){return window.supabaseClient||window.sb||null}function install(){const f=document.querySelector('#documentForm,form[data-module="documents"],#documentsModal form,#addDocumentModal form');if(!f||f.querySelector('#docUploadV1Box'))return;const u=f.querySelector('input[name="file_url"],#file_url,#docFileUrl,input[type="url"]'),b=document.createElement('div');b.id='docUploadV1Box';b.innerHTML='<label style="font-weight:700;display:block;margin-bottom:6px">Upload Document</label><input id="docRealFileV1" type="file" accept=".pdf,.doc,.docx"><div id="docFileStateV1" class="du-note">PDF or Word · Maximum 2 MB. For larger files, use External Link below.</div>';if(u)u.parentElement.insertAdjacentElement('beforebegin',b);else f.prepend(b);const i=b.querySelector('input'),st=b.querySelector('div');i.onchange=()=>{const x=i.files[0];if(!x)return;const ok=x.size<=MAX&&/\\.(pdf|docx?)$/i.test(x.name);st.className='du-note '+(ok?'du-ok':'du-bad');st.textContent=ok?x.name+' · '+Math.ceil(x.size/1024)+' KB ✓':(x.size>MAX?'This file exceeds the 2 MB MOLMS limit. Compress it or use External Link.':'Only PDF and Word documents are allowed.');if(!ok)i.value=''};f.addEventListener('submit',async e=>{const x=i.files[0];if(!x)return;e.preventDefault();e.stopImmediatePropagation();const db=c();if(!db||!db.storage){alert('Document storage is unavailable.');return}const m=(f.querySelector('[name="linked_case_id"],[name="linked_nonlit_id"],[name="linked_matter"]')||{}).value||'general',path=m+'/'+Date.now()+'-'+x.name.replace(/[^a-zA-Z0-9._-]+/g,'_');st.textContent='Uploading securely…';const r=await db.storage.from(BUCKET).upload(path,x,{contentType:x.type,upsert:false});if(r.error){st.className='du-note du-bad';st.textContent='Upload failed: '+r.error.message;return}function h(n,v){let q=f.querySelector('input[name="'+n+'"]');if(!q){q=document.createElement('input');q.type='hidden';q.name=n;f.appendChild(q)}q.value=v}h('storage_path',path);h('original_file_name',x.name);h('mime_type',x.type);h('file_size',x.size);h('storage_type','upload');if(u)u.value='';i.value='';st.className='du-note du-ok';st.textContent='Uploaded securely ✓ Saving document record…';f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))},true)}new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('click',()=>setTimeout(install,50));setTimeout(install,500);window.molmsOpenStoredDocument=async p=>{const r=await c().storage.from(BUCKET).createSignedUrl(p,300);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank','noopener')}})();
</script>
'''
          p.write_text(s.replace('</body>',block+'\n</body>'))
          PY
      - name: Commit production patch
        run: |
          git config user.name 'MOLMS Deployment Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'feat(documents): enable secure small-file uploads'
          git push
