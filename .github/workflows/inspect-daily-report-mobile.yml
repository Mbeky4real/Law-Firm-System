name: inspect-daily-report-mobile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-daily-report-mobile.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect report detail structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-core.html').read_text(errors='ignore')
          needles=['Report Details','PARTNER REVIEW','PARTNER ATTENTION','WORK PERFORMED','Report Information','report detail','rptDetail','reportDetail']
          for n in needles:
            print('\n===',n,'===')
            pos=0; count=0
            while True:
              i=s.lower().find(n.lower(),pos)
              if i<0 or count>=6: break
              print(s[max(0,i-900):min(len(s),i+1800)].replace('\n',' ')[:2700])
              pos=i+1; count+=1
          PY