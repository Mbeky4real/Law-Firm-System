name: Finance concise KPI copy v12
on:
  workflow_dispatch:
  push:
    paths: ['.github/finance-kpi-copy-v12.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/patch-finance-kpi-copy-v12.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='surrogateescape')
          for x in ['MOLMS-FINANCE-KPI-COPY-V12 runtime','Revenue recorded this period.','Cash received this period.','Unpaid from this period’s invoices.','Operating expenses this period.','Cash available as at']:
              assert x in s,x
          assert 'MOLMS-FINANCE-PERIOD-OUTLOOK-V11' in s
          print('verification passed')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refine(finance): simplify KPI explanations'
          git push origin main
