name: Settings Protection Center v1
on:
  push:
    paths: ['.github/settings-protection-center-v1.trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Settings Protection Center
        run: python .github/settings-protection-center-v1.py
      - name: Verify production source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='surrogateescape')
          required=['MOLMS-SETTINGS-PROTECTION-CENTER-V1','Back Up Now','Backup History','Controlled Restore Only','settingsCreateBackup','system-backup','Backup &amp; Recovery']
          forbidden=['onclick="systemReset()"','onclick="fullDataWipe()"','async function systemReset(){','async function fullDataWipe(){','<h3>⚠ Danger Zone</h3>']
          for x in required: assert x in s,x
          for x in forbidden: assert x not in s,x
          print('Settings Protection Center verification passed')
          PY
      - name: Retire migration machinery and commit
        run: |
          rm -f .github/settings-protection-center-v1.py .github/settings-protection-center-v1.trigger .github/workflows/settings-protection-center-v1.yml
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(settings): build system protection and backup center'
          git push origin HEAD:main
