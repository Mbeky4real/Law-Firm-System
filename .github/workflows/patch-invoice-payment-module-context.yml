name: patch-invoice-payment-module-context
on:
  push:
    branches: [fix-invoice-payment-module-context-20260905]
    paths:
      - '.github/patch-invoice-payment-module-context.py'
      - '.github/workflows/patch-invoice-payment-module-context.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-invoice-payment-module-context-20260905
      - name: Apply patch
        run: python .github/patch-invoice-payment-module-context.py
      - name: Verify injected JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='MOLMS-INVOICE-PAYMENT-CONTEXT-V3'
          assert marker in s
          a=s.index('<script>',s.index(marker)-20)+8
          b=s.index('</script>',a)
          Path('/tmp/inv-context-v3.js').write_text(s[a:b])
          PY
          node --check /tmp/inv-context-v3.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(invoice): keep record payment inside invoice module'
          git push origin HEAD:fix-invoice-payment-module-context-20260905
