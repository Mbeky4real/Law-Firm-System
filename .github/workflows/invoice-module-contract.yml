name: Invoice module contract
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/invoice-workflow-v3.js'
      - 'docs/INVOICE_MODULE_CONTRACT.md'
      - 'tests/invoice-module-contract.test.mjs'
      - '.github/workflows/invoice-module-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/invoice-workflow-v3.js'
      - 'docs/INVOICE_MODULE_CONTRACT.md'
      - 'tests/invoice-module-contract.test.mjs'
      - '.github/workflows/invoice-module-contract.yml'
jobs:
  invoice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/invoice-module-contract.test.mjs
