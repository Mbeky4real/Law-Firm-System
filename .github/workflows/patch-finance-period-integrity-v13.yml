name: Finance period integrity v13
on:
  workflow_dispatch:
  push:
    paths: ['.github/finance-period-integrity-v13.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply period integrity
        run: python .github/patch-finance-period-integrity-v13.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='surrogateescape')
          checks={
            'marker':s.count('MOLMS-FINANCE-PERIOD-INTEGRITY-V13 runtime')==1,
            'as of receivables':'receivableSourcesAsOf' in s,
            'manual period guard':'No manual financial transactions for the selected period.' in s,
            'invoice date cutoff':'dt>end' in s,
            'manual date cutoff':'!dt||dt>end' in s,
            'kpi copy correction':"'PAYMENTS RECEIVED':'Cash received this period.'" in s,
          }
          print(checks)
          assert all(checks.values())
          PY
      - name: Commit production source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(finance): enforce historical period integrity'
          git push origin main
