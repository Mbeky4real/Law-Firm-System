name: restore-stable-sidebar
on:
  push:
    branches: [fix-restore-stable-sidebar-20260905]
    paths:
      - '.github/restore-stable-sidebar.py'
      - '.github/workflows/restore-stable-sidebar.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original sidebar
        run: python .github/restore-stable-sidebar.py
      - name: Verify navigation structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          navs=re.findall(r'<button[^>]+class="sidebtn[^>]+data-nav="([^"]+)"[^>]*onclick="go\(\'([^\']+)\'\)"',s)
          print('desktop nav:',navs)
          required={'dashboard','cause','nonlit','reports','diary','documents','chat','budget','expenses','invoice','findash','payroll','hr','members','settings'}
          found={a for a,b in navs if a==b}
          missing=required-found
          assert not missing, 'missing/broken sidebar routes: '+str(sorted(missing))
          assert 'sidebarV9BContext' not in s
          assert 'new MutationObserver(()=>{sync();financeIntro()})' not in s
          assert "assets/molms-office-sidebar.webp" not in s
          assert s.count('</body>')==1
          assert s.count('</html>')==1
          PY
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=[]
          for x in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
            attrs,body=x
            if 'src=' not in attrs.lower(): scripts.append(body)
          Path('/tmp/molms-inline.js').write_text('\n;\n'.join(scripts))
          print('inline scripts:',len(scripts))
          PY
          node --check /tmp/molms-inline.js
      - name: Commit restored sidebar
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change"
            exit 0
          fi
          git config user.name "MOLMS Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): restore proven sidebar navigation"
          git push
