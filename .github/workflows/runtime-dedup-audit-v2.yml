name: MOLMS runtime duplicate audit v2
on:
  push:
    paths: ['.github/runtime-dedup-audit-v2.trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/maintenance/runtime-dedup-audit-v2.py
      - run: test -f SYSTEM-RUNTIME-DUPLICATE-AUDIT-20260907.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SYSTEM-RUNTIME-DUPLICATE-AUDIT-20260907.md
          git commit -m 'audit(system): record runtime duplicate findings' || exit 0
          git push origin main
