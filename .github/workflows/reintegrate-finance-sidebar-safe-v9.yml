name: reintegrate-finance-sidebar-safe-v9
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reintegrate-finance-sidebar-safe-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded finance/sidebar refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('index.html')
          s=p.read_text(errors='surrogateescape')
          MARK='MOLMS-FINANCE-SIDEBAR-V9'
          if MARK in s:
              print('Already patched'); raise SystemExit(0)

          # Hard safety gates: auth and app-shell behavior must remain intact.
          required=[
            'sb.auth.signInWithPassword',
            "const url='https://myjkthjgnmzabmuwprqp.supabase.co';",
            '<nav class="bottom-nav hidden">',
            'function _setBottomNavHidden',
            'id="page-findash"',
            'id="fdKpiRow"',
            'class="sb-clock"'
          ]
          for x in required:
              assert x in s, f'Missing required stable marker: {x}'
          assert s.count('id="page-findash"')==1, 'Financial dashboard duplicated'
          assert s.count('class="sb-clock"')==1, 'Sidebar clock anchor is not unique'

          # Protect the known payroll print template that was broken in the prior attempt.
          payroll_anchor="w.prDownloadPayslipPDF=()=>"
          assert payroll_anchor in s, 'Payslip template anchor missing'
          pay_start=s.index(payroll_anchor)
          pay_end=s.find('// —— PERIOD CLOSING', pay_start)
          assert pay_end>pay_start, 'Payslip template end not found'
          payroll_before=hashlib.sha256(s[pay_start:pay_end].encode('utf-8','surrogatepass')).hexdigest()

          sidebar='''\n    <div class="sb-v9-context" id="sidebarV9Context">\n      <div class="sb-v9-photo" aria-hidden="true"></div>\n      <div class="sb-v9-copy">\n        <div class="sb-v9-kicker" id="sidebarV9Kicker">M&amp;O MANAGEMENT</div>\n        <div class="sb-v9-message" id="sidebarV9Message">See what needs your attention, then act.</div>\n        <div class="sb-v9-note" id="sidebarV9Note">Clear management information without unnecessary accounting detail.</div>\n      </div>\n    </div>\n'''
          anchor='    <div class="sb-clock">'
          assert s.count(anchor)==1
          s=s.replace(anchor,sidebar+anchor,1)

          # Insert only at the TRUE document closing body, never at template strings.
          m=re.search(r'</body>\s*</html>\s*$',s,re.I|re.S)
          assert m, 'Terminal document close not found; refusing patch'
          insert_at=m.start()
          ui=r'''\n<style>\n/* MOLMS-FINANCE-SIDEBAR-V9 */\n.sb-v9-context{margin:8px 12px 10px;border:1px solid rgba(255,255,255,.14);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.055)}\n.sb-v9-photo{height:92px;background:url('assets/molms-office-sidebar.webp') center/cover no-repeat;position:relative}.sb-v9-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,36,64,.03),rgba(15,36,64,.76))}\n.sb-v9-copy{padding:10px 11px 12px}.sb-v9-kicker{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:4px}.sb-v9-message{font-family:Georgia,serif;font-size:13px;line-height:1.35;color:#fff}.sb-v9-note{font-size:10px;line-height:1.35;color:rgba(255,255,255,.58);margin-top:5px}\n#page-findash .fd-v9-intro{padding:12px 24px 0}.fd-v9-intro-card{background:linear-gradient(135deg,#0f2440,#183a62);color:#fff;border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:0 8px 20px rgba(15,36,64,.12)}.fd-v9-intro h3{margin:0;color:#fff;font-size:17px}.fd-v9-intro p{margin:4px 0 0;color:rgba(255,255,255,.72);font-size:11px}.fd-v9-badge{white-space:nowrap;background:rgba(201,151,58,.18);border:1px solid rgba(201,151,58,.45);color:#f2cf84;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}\n#page-findash #fdKpiRow{margin-top:10px!important}#page-findash #fdKpiRow>.card,#page-findash #fdKpiRow>[class*="card"]{box-shadow:0 4px 14px rgba(15,36,64,.055)!important;border-radius:14px!important}\n#page-findash #fdPriorityRowV4,#page-findash #fdPriorityRowV7{align-items:start!important}\n@media(max-width:1199px){.sb-v9-context{display:none}}\n@media(max-width:700px){#page-findash .fd-v9-intro{padding:10px 12px 0}.fd-v9-intro-card{align-items:flex-start;flex-direction:column;gap:8px}}\n</style>\n<script>\n/* MOLMS-FINANCE-SIDEBAR-V9 runtime — additive, no auth/login changes. */\n(function(){\n const contexts={dashboard:['FIRM OVERVIEW','Start with what needs attention today.','Urgent matters, deadlines and team activity at a glance.'],cause:['LITIGATION','Stay ahead of the next court step.','Hearings, deadlines and matters requiring action.'],nonlit:['NON-LITIGATION','Keep advisory work moving.','Current work, responsible member and next step.'],reports:['DAILY REPORTS','Know what was done and what remains.','Progress without turning MOLMS into an HR system.'],diary:['LEGAL DIARY','Protect every important date.','Hearings, deadlines and commitments in one place.'],documents:['DOCUMENTS','Find the right document quickly.','Keep each matter record organised and accessible.'],chat:['INTERCOM','Keep internal communication inside the work.','Short, relevant and connected to the firm.'],hr:['HR','Manage people without unnecessary complexity.','Employment and leave information only where it helps decisions.'],payroll:['PAYROLL','Complete payroll accurately and move on.','Salary processing with statutory controls, not an accounting suite.'],budget:['OFFICE BUDGET','Approve spending before money moves.','Simple control of requests and commitments.'],expenses:['EXPENSE REGISTER','Know what the office has spent.','Approved expenditure and supporting records.'],invoice:['INVOICES','From agreed fee to collected cash.','Issue, revise and record payment in one continuous workflow.'],findash:['FINANCIAL DASHBOARD','Know the firm’s financial position in 30 seconds.','Summary first, exceptions second, detail only when needed.'],members:['MEMBERS','Know who is responsible for what.','Keep access and responsibilities current.'],settings:['SETTINGS','Keep MOLMS aligned with the firm.','System preferences without disturbing daily work.']};\n function setContext(k){const c=contexts[k]||contexts.dashboard;[['sidebarV9Kicker',0],['sidebarV9Message',1],['sidebarV9Note',2]].forEach(([id,i])=>{const e=document.getElementById(id);if(e)e.textContent=c[i]});}\n function syncContext(){const a=document.querySelector('.sidebtn.active[data-nav]');if(a)setContext(a.dataset.nav);}\n document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n)setContext(n.dataset.nav)});\n function financeIntro(){const root=document.getElementById('page-findash'),k=document.getElementById('fdKpiRow');if(!root||!k)return;if(document.getElementById('fdV9Intro'))return;const d=document.createElement('div');d.id='fdV9Intro';d.className='fd-v9-intro';d.innerHTML='<div class="fd-v9-intro-card"><div><h3>Executive financial view</h3><p>Start with the headline position, then deal with receivables and obligations that need attention.</p></div><div class="fd-v9-badge">Management view</div></div>';k.parentNode.insertBefore(d,k);}\n function apply(){syncContext();financeIntro();}\n window.addEventListener('load',()=>{apply();[400,1000,1800,3000].forEach(t=>setTimeout(apply,t));});\n new MutationObserver(()=>{syncContext();financeIntro()}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});\n})();\n</script>\n'''
          s=s[:insert_at]+ui+s[insert_at:]

          # Post-patch guardrails.
          assert s.count('MOLMS-FINANCE-SIDEBAR-V9 runtime')==1
          assert s.count('id="sidebarV9Context"')==1
          assert s.count('id="page-findash"')==1
          assert '<nav class="bottom-nav hidden">' in s
          assert 'sb.auth.signInWithPassword' in s
          assert "const url='https://myjkthjgnmzabmuwprqp.supabase.co';" in s
          pay_start2=s.index(payroll_anchor); pay_end2=s.find('// —— PERIOD CLOSING',pay_start2)
          payroll_after=hashlib.sha256(s[pay_start2:pay_end2].encode('utf-8','surrogatepass')).hexdigest()
          assert payroll_before==payroll_after, 'Payslip template changed — refusing deployment'
          assert s.rfind('MOLMS-FINANCE-SIDEBAR-V9 runtime') > s.find('// —— PERIOD CLOSING'), 'Runtime inserted before payroll close'
          p.write_text(s,errors='surrogateescape')
          print('Safe V9 patch applied')
          PY
      - name: Verify small scoped diff
        run: |
          git diff --stat -- index.html
          python - <<'PY'
          import subprocess
          out=subprocess.check_output(['git','diff','--numstat','--','index.html']).decode().strip().split()
          assert len(out)>=2, 'No index diff found'
          add,delete=int(out[0]),int(out[1])
          print({'additions':add,'deletions':delete})
          assert add < 90 and delete < 10, 'Patch too large; refusing deployment'
          PY
      - name: Commit refined production UI
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(ui): safely refine financial dashboard and contextual sidebar'
          git push origin HEAD:main
