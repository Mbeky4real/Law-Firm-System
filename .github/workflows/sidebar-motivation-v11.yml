name: sidebar-motivation-v11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sidebar-motivation-v11.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Replace operational sidebar copy with approved M&O motivation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html'); s=p.read_text(errors='surrogateescape')
          MARK='MOLMS-SIDEBAR-MOTIVATION-V11'
          if MARK in s: raise SystemExit(0)
          required=["const url='https://myjkthjgnmzabmuwprqp.supabase.co';",'sb.auth.signInWithPassword','<nav class="bottom-nav hidden">','MOLMS-FINANCE-SIDEBAR-V9 runtime','id="sidebarV9Context"']
          for x in required: assert x in s, 'missing '+x
          pa='w.prDownloadPayslipPDF=()=>'; ps=s.index(pa); pe=s.find('// —— PERIOD CLOSING',ps); assert pe>ps
          ph=hashlib.sha256(s[ps:pe].encode('utf-8','surrogatepass')).hexdigest()
          start=s.index('const contexts={', s.index('MOLMS-FINANCE-SIDEBAR-V9 runtime'))
          end=s.index('};',start)+2
          contexts="""const contexts={dashboard:['M&O LAW OFFICE','Discipline today. Greater impact tomorrow.','EXCELLENCE IN PRACTICE'],cause:['M&O LAW OFFICE','Justice is not a product of chance, but of preparation, diligence and principle.','EXCELLENCE IN PRACTICE'],nonlit:['M&O LAW OFFICE','Good advice prevents bigger problems.','EXCELLENCE IN PRACTICE'],clients:['M&O LAW OFFICE','People trust us with their most important decisions.','EXCELLENCE IN PRACTICE'],matters:['M&O LAW OFFICE','Every matter matters.','EXCELLENCE IN PRACTICE'],invoice:['M&O LAW OFFICE','Agreed fees are the beginning. Collected fees keep us going.','EXCELLENCE IN PRACTICE'],findash:['M&O LAW OFFICE','Financial discipline fuels independence.','EXCELLENCE IN PRACTICE'],hr:['M&O LAW OFFICE','Our people are our greatest asset.','EXCELLENCE IN PRACTICE'],members:['M&O LAW OFFICE','Our people are our greatest asset.','EXCELLENCE IN PRACTICE'],payroll:['M&O LAW OFFICE','Reward work fairly. Build commitment continuously.','EXCELLENCE IN PRACTICE'],diary:['M&O LAW OFFICE','A well-managed day builds a successful practice.','EXCELLENCE IN PRACTICE'],documents:['M&O LAW OFFICE','Precision in documentation protects opportunities.','EXCELLENCE IN PRACTICE'],reports:['M&O LAW OFFICE','Information today. Better decisions tomorrow.','EXCELLENCE IN PRACTICE'],chat:['M&O LAW OFFICE','Clear communication builds stronger teams.','EXCELLENCE IN PRACTICE'],budget:['M&O LAW OFFICE','Discipline in small things builds strength in greater things.','EXCELLENCE IN PRACTICE'],expenses:['M&O LAW OFFICE','Stewardship is part of professional excellence.','EXCELLENCE IN PRACTICE'],settings:['M&O LAW OFFICE','A strong system supports a stronger team.','EXCELLENCE IN PRACTICE']};"""
          s=s[:start]+contexts+s[end:]
          # Refine quote presentation without altering navigation/routing.
          terminal=s.rfind('</style>'); assert terminal!=-1
          css="""\n<style>/* MOLMS-SIDEBAR-MOTIVATION-V11 */\n.sb-v9-copy{text-align:center;padding:11px 12px 13px!important}.sb-v9-kicker{font-size:9px!important;letter-spacing:.16em!important}.sb-v9-message{font-family:Georgia,'Times New Roman',serif!important;font-style:italic!important;font-size:13px!important;line-height:1.48!important;color:#fff!important}.sb-v9-note{font-size:8px!important;letter-spacing:.19em!important;text-transform:uppercase!important;color:rgba(242,207,132,.78)!important;margin-top:9px!important}.sb-v9-note:before{content:'';display:block;width:34px;height:1px;background:var(--gold);margin:0 auto 8px}.sb-v9-photo{height:98px!important}\n</style>\n"""
          # use true document close; safe from embedded templates
          close=s.rfind('</body>'); assert close!=-1
          s=s[:close]+css+s[close:]
          ps2=s.index(pa); pe2=s.find('// —— PERIOD CLOSING',ps2)
          assert hashlib.sha256(s[ps2:pe2].encode('utf-8','surrogatepass')).hexdigest()==ph
          assert s.count(MARK)==1
          assert 'See what needs your attention, then act.' not in s
          assert '<nav class="bottom-nav hidden">' in s and 'sb.auth.signInWithPassword' in s
          p.write_text(s,errors='surrogateescape')
          PY
      - name: Verify scoped change
        run: |
          git diff --stat -- index.html
          python - <<'PY'
          import subprocess
          a,d=map(int,subprocess.check_output(['git','diff','--numstat','--','index.html']).decode().split()[:2])
          assert a<20 and d<20, (a,d)
          PY
      - name: Commit approved sidebar
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(ui): replace sidebar instructions with approved motivational messages'
          git push origin HEAD:main
