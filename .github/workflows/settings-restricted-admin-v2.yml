name: Settings Restricted Administration v2
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/settings-restricted-admin-v2.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply restricted administration UI
        run: python .github/patch-settings-restricted-admin-v2.py
      - name: Verify
        run: |
          grep -q 'MOLMS-SETTINGS-RESTRICTED-ADMIN-V2' index.html
          grep -q "restricted-system-admin" index.html
          grep -q 'DELETE ALL MOLMS OPERATIONAL DATA' index.html
      - name: Commit production source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(settings): restore restricted reset and wipe controls'
          git push origin HEAD:main
