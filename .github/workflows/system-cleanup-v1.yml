name: MOLMS system cleanup v1
on:
  push:
    paths: ['.github/system-cleanup-v1.trigger']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run system cleanup audit
        run: python .github/maintenance/system-cleanup-v1.py
      - name: Verify repository health
        run: |
          test -f index.html
          test -f SYSTEM-CLEANUP-AUDIT-20260907.md
          ! find .github -maxdepth 1 -type f -name 'patch-*.py' | grep .
          ! find .github -maxdepth 1 -type f -name '*.trigger' ! -name 'system-cleanup-v1.trigger' | grep .
          ! find .github/workflows -maxdepth 1 -type f -name 'patch-*.yml' | grep .
          grep -q 'MOLMS-FINANCE-CANONICAL-V15' index.html
          grep -q 'MOLMS-INVOICE-CANONICAL-V6' index.html
      - name: Commit cleaned system
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(system): remove obsolete patch machinery and stale backups' || exit 0
          git push origin main
