name: patch-payment-router-v4
on:
  push:
    branches: [fix-payment-router-v4-20260905]
    paths:
      - '.github/patch-payment-router-v4.py'
      - '.github/workflows/patch-payment-router-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-payment-router-v4-20260905
      - name: Apply patch
        run: python .github/patch-payment-router-v4.py
      - name: Verify injected JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='MOLMS-INVOICE-PAYMENT-ROUTER-V4'
          assert marker in s
          a=s.index('<script>',s.index(marker)-20)+8
          b=s.index('</script>',a)
          Path('/tmp/router-v4.js').write_text(s[a:b])
          PY
          node --check /tmp/router-v4.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(invoice): force payment workflow into invoice module'
          git push origin HEAD:fix-payment-router-v4-20260905
