name: patch-notification-watermarks-v1
on:
  push:
    branches: [fix-notification-watermarks-20260906]
    paths:
      - '.github/patch-notification-watermarks-v1.py'
      - '.github/workflows/patch-notification-watermarks-v1.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply notification watermark fix
        run: python .github/patch-notification-watermarks-v1.py
      - name: Verify notification architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "LS.viewed+':'+uid" in s
          assert 'countFor(p)-(viewed[p]||0)' not in s
          assert "NOTIFICATION_MODULES=['cause','nonlit','reports','diary','documents','members']" in s
          assert "page=p;if(p!=='dashboard')markModuleSeen(p);" in s
          assert 'saveViewedState()' in s
          print('notification structure OK')
          PY
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/molms-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/molms-inline.js
      - name: Commit notification fix
        run: |
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix(notifications): track genuine unread activity per user'
          git push
