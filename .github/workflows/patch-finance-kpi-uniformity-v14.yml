name: Finance KPI uniformity v14
on:
  push:
    paths: ['.github/finance-kpi-uniformity-v14.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply uniform KPI wording
        run: python .github/patch-finance-kpi-uniformity-v14.py
      - name: Verify
        run: |
          grep -q 'MOLMS-FINANCE-KPI-UNIFORMITY-V14' index.html
          grep -q 'Cash received this period.' index.html
          grep -q 'Unpaid from this period’s invoices.' index.html
          grep -q 'Operating expenses this period.' index.html
      - name: Commit production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(finance): make KPI descriptions uniform' || exit 0
          git push origin main
