name: office-manager-access-patch
on:
  push:
    branches:
      - office-manager-access-20260904
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        run: python .github/patch-office-manager-access.py
      - name: Syntax check
        run: |
          node --check /tmp/molms-inline.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "MOLMS Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-office-manager-access.yml .github/patch-office-manager-access.py
          git add index.html
          git commit -m "feat(rbac): complete Office Manager delegated access"
          git push origin HEAD:office-manager-access-20260904
