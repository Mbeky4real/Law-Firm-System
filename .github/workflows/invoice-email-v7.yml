name: Invoice email delivery v7
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-invoice-email-v7.py'
      - '.github/invoice-email-v7.trigger'
      - '.github/workflows/invoice-email-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply invoice email delivery patch
        run: python .github/patch-invoice-email-v7.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('MOLMS-INVOICE-EMAIL-V7')==1
          assert "sb.functions.invoke('send-invoice-email'" in s
          assert "error.context.json" in s
          print('invoice email v7 verified')
          PY
      - name: Commit production source
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(invoice): harden email edge-function delivery'
          git push origin HEAD:main
