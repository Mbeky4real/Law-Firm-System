name: patch-dashboard-payment-direct-v5
on:
  push:
    branches: [fix-dashboard-payment-direct-v5-20260905]
    paths:
      - '.github/patch-dashboard-payment-direct-v5.py'
      - '.github/workflows/patch-dashboard-payment-direct-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-dashboard-payment-direct-v5.py
      - name: Verify injected JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='MOLMS-DASHBOARD-PAYMENT-DIRECT-V5'
          assert marker in s
          a=s.index('<script>', s.index(marker)-20)+8
          b=s.index('</script>',a)
          Path('/tmp/payment-v5.js').write_text(s[a:b])
          PY
          node --check /tmp/payment-v5.js
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No change'; exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(invoice): route dashboard payment action to invoice module'
          git push origin HEAD:fix-dashboard-payment-direct-v5-20260905
