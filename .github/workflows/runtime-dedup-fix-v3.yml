name: MOLMS runtime dedupe fix v3
on:
  push:
    paths: ['.github/runtime-dedup-fix-v3.trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Remove shadowed runtime duplicates and retire maintenance files
        run: python .github/maintenance/runtime-dedup-fix-v3.py
      - name: Verify production source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='surrogateescape')
          for n in ['invNewInvoice','invRenderSavedList','invPaymentRecalc']:
              c=len(re.findall(r'(?m)^\s*function\s+'+re.escape(n)+r'\s*\(',s))
              assert c==1,(n,c)
          assert 'MOLMS-INVOICE-CANONICAL-V6' in s
          assert 'MOLMS-FINANCE-CANONICAL-V15' in s
          print('runtime dedupe verification passed')
          PY
      - name: Commit final cleaned runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(system): remove shadowed runtime duplicates and retire cleanup machinery' || exit 0
          git push origin main
