name: fix-daily-report-mobile-v1b
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-report-mobile-v1b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/patch_daily_report_mobile_v1.py
      - name: Verify
        run: |
          grep -q 'MOLMS-REPORT-DETAILS-MOBILE-V1' app-core.html
          grep -q "frame.src='/app-core.html?v=20260910b'" index.html
          git diff --stat -- app-core.html index.html
      - name: Commit
        run: |
          if git diff --quiet -- app-core.html index.html; then exit 0; fi
          git config user.name 'MOLMS Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-core.html index.html
          git commit -m 'fix(report): perfect Daily Report Details on mobile'
          git push origin HEAD:main
